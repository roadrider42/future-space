<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  ⚠️ DIESE DATEI IST ABSICHTLICH KEINE KOPIE VON index.html.

  `bplus/404.html` ist eine Kopie mit genau drei geaenderten Zeilen -- 461
  Zeilen, die ein zweites Mal dastehen, ohne dass irgendetwas sie vergleicht.
  Das ist in diesem Projekt eine benannte Fehlerklasse: Die Kopie veraltet,
  und sie sieht echt aus. Wer hier spaeter doch eine Kopie baut, braucht eine
  Pruefung daneben, die beide Dateien vergleicht.

  Was die Kopie leisten sollte, leistet hier ein Verweis: Wer sich verlaufen
  hat, kommt mit einem Druck zur Seite zurueck. Der `noindex`-Eintrag steht
  auch hier -- er gilt je Datei, nicht je Auslieferung.
-->
<meta name="robots" content="noindex, nofollow">
<title>Seite nicht gefunden · Future Space — Angebotsfassung</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 1.25rem;
    font: 17px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #11242e; background: #ffffff;
  }
  main { max-width: 32rem; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; margin: 0 0 .6em; }
  p { color: #5b6c74; margin: 0 0 1.5rem; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: .875rem 1.5rem; border-radius: 6px;
    background: #951E81; color: #fff; text-decoration: none; font-weight: 650;
  }
  a:focus-visible { outline: 3px solid #951E81; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht hat sich in der Adresse etwas verschrieben. Der Vorschlag selbst steht noch.</p>
  <a href="/">Zurück zum Vorschlag</a>
</main>
</body>
</html>
